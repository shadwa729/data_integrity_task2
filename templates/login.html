<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

</head>
<body>
    <div class="container">
        <h2>Login</h2>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        {% if success %}
            <p class="success">{{ success }}</p>
        {% endif %}
        {% if message %}
        <div class="alert alert-info">{{ message }}</div>
        {% endif %}
    
        <!-- Manual Login Form -->
        <form method="POST" action="/login">
            <input type="text" name="username_email" placeholder="Username or Email" required>
            <div class="password-container">
                <input type="password" name="password" id="password" placeholder="Password" required>
                <ion-icon name="lock-closed-outline" class="toggle-password" onclick="togglePassword(this)"></ion-icon>
            </div>
            
            <label style="float:left; margin-bottom: 16px;">
                <input type="checkbox" name="remember"> Remember Me
            </label>
            <br style="clear:both;">
            <button type="submit">Login</button>
        </form>

        <hr>

        <!-- GitHub OAuth Login -->
        <a href="{{ url_for('github_login') }}">
            <button style="background-color:#333;">Login with GitHub</button>
        </a>

        <p>Don't have an account? <a href="/signup">Signup here</a>.</p>
    </div>
    <script>
        function togglePassword(icon) {
            const input = icon.previousElementSibling;
            const isPassword = input.type === "password";
            input.type = isPassword ? "text" : "password";
            icon.name = isPassword ? "lock-open-outline" : "lock-closed-outline";
        }
        </script>
        
</body>
</html>
